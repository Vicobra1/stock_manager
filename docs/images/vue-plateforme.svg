<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Comment fonctionne StockBoutique</title>
  <desc id="desc">L'utilisateur utilise l'interface React, qui communique avec l'API Django et la base de données pour gérer les produits, les fournisseurs et les mouvements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#18243a"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#7857f5"/><stop offset="1" stop-color="#a276ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050914" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8796b5"/></marker>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#aab6cd}.title{fill:#f5f7ff;font-size:36px;font-weight:700}.label{fill:#f5f7ff;font-size:22px;font-weight:700}.small{fill:#b9c5da;font-size:16px}.chip{font-size:14px;font-weight:600}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="160" fill="#7857f5" opacity=".08"/><circle cx="100" cy="660" r="180" fill="#25c995" opacity=".05"/>
  <text x="72" y="86" class="title">StockBoutique, du clic au stock à jour</text>
  <text x="72" y="119" class="muted" font-size="18">Une interface, une API et une base de données travaillent ensemble.</text>
  <g filter="url(#shadow)">
    <rect x="65" y="210" width="275" height="270" rx="22" fill="#202d45" stroke="#34425f"/>
    <rect x="462" y="210" width="275" height="270" rx="22" fill="#202d45" stroke="#34425f"/>
    <rect x="859" y="210" width="275" height="270" rx="22" fill="#202d45" stroke="#34425f"/>
  </g>
  <path d="M350 345H440" stroke="#8796b5" stroke-width="4" marker-end="url(#arrow)"/><path d="M747 345H837" stroke="#8796b5" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="365" y="322" class="small">HTTP / JSON</text><text x="762" y="322" class="small">Données</text>
  <!-- interface icon -->
  <rect x="92" y="241" width="58" height="48" rx="9" fill="url(#purple)"/><rect x="102" y="251" width="38" height="27" rx="3" fill="#f7f6ff" opacity=".95"/><path d="M109 260h23M109 267h16" stroke="#7857f5" stroke-width="3" stroke-linecap="round"/>
  <text x="92" y="329" class="label">Interface web</text><text x="92" y="362" class="small">React + TypeScript</text>
  <rect x="92" y="397" width="220" height="31" rx="15" fill="#2e3b56"/><text x="108" y="418" class="chip" fill="#dce4f5">Catalogue · recherche · actions</text>
  <rect x="92" y="439" width="220" height="25" rx="12" fill="#2e3b56"/><text x="108" y="457" class="chip" fill="#dce4f5">Vente · entrée · alertes</text>
  <!-- api icon -->
  <circle cx="490" cy="265" r="27" fill="#1bbf91"/><path d="M480 265h20M490 255v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="490" y="329" class="label">API métier</text><text x="490" y="362" class="small">Django REST Framework</text>
  <rect x="490" y="397" width="220" height="31" rx="15" fill="#2e3b56"/><text x="506" y="418" class="chip" fill="#dce4f5">Valide les opérations</text>
  <rect x="490" y="439" width="220" height="25" rx="12" fill="#2e3b56"/><text x="506" y="457" class="chip" fill="#dce4f5">Protège le stock négatif</text>
  <!-- database icon -->
  <ellipse cx="890" cy="251" rx="28" ry="11" fill="#f0aa3c"/><path d="M862 251v31c0 7 13 12 28 12s28-5 28-12v-31M862 267c0 7 13 12 28 12s28-5 28-12" fill="none" stroke="#f0aa3c" stroke-width="4"/>
  <text x="890" y="329" class="label">Base de données</text><text x="890" y="362" class="small">SQLite en développement</text>
  <rect x="890" y="397" width="220" height="31" rx="15" fill="#2e3b56"/><text x="906" y="418" class="chip" fill="#dce4f5">Produits · fournisseurs</text>
  <rect x="890" y="439" width="220" height="25" rx="12" fill="#2e3b56"/><text x="906" y="457" class="chip" fill="#dce4f5">Historique des mouvements</text>
  <text x="72" y="555" class="label" font-size="20">Chaque opération de stock suit le même cycle</text>
  <g>
    <rect x="72" y="584" width="235" height="58" rx="16" fill="#25324a"/><text x="94" y="609" class="small">1 · Demande</text><text x="94" y="630" fill="#fff" font-size="16" font-weight="600">Vendre ou réapprovisionner</text>
    <path d="M314 613h36" stroke="#8796b5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="364" y="584" width="235" height="58" rx="16" fill="#25324a"/><text x="386" y="609" class="small">2 · Vérification</text><text x="386" y="630" fill="#fff" font-size="16" font-weight="600">Quantité et règles métier</text>
    <path d="M606 613h36" stroke="#8796b5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="656" y="584" width="235" height="58" rx="16" fill="#25324a"/><text x="678" y="609" class="small">3 · Mise à jour</text><text x="678" y="630" fill="#fff" font-size="16" font-weight="600">Quantité disponible recalculée</text>
    <path d="M898 613h36" stroke="#8796b5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="948" y="584" width="180" height="58" rx="16" fill="#25324a"/><text x="970" y="609" class="small">4 · Historique</text><text x="970" y="630" fill="#fff" font-size="16" font-weight="600">Mouvement conservé</text>
  </g>
</svg>
