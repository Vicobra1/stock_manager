<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Vente et réapprovisionnement dans StockBoutique</title>
  <desc id="desc">Deux parcours : une vente vérifie la quantité avant de diminuer le stock; une entrée augmente la quantité. Chaque opération est inscrite dans l'historique puis le seuil d'alerte est recalculé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#18243a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8796b5"/></marker>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#f5f7ff;font-size:34px;font-weight:700}.sub{fill:#aab6cd;font-size:17px}.h{fill:#f5f7ff;font-size:20px;font-weight:700}.t{fill:#d5deef;font-size:16px}.tag{font-size:14px;font-weight:700}</style>
  </defs>
  <rect width="1200" height="660" rx="28" fill="url(#bg)"/>
  <text x="64" y="74" class="title">Deux opérations, un stock toujours suivi</text>
  <text x="64" y="108" class="sub">Les changements de quantité sont contrôlés et conservés dans l’historique.</text>
  <!-- Sale lane -->
  <rect x="54" y="145" width="1092" height="205" rx="22" fill="#1c293e" stroke="#35445e"/>
  <rect x="76" y="167" width="137" height="30" rx="15" fill="#442a39"/><text x="96" y="188" class="tag" fill="#ff9b9b">VENTE</text>
  <g fill="#26344b" stroke="#3d4d69">
    <rect x="82" y="220" width="205" height="87" rx="16"/><rect x="363" y="220" width="205" height="87" rx="16"/><rect x="644" y="220" width="205" height="87" rx="16"/><rect x="925" y="220" width="190" height="87" rx="16"/>
  </g>
  <path d="M294 263h53M575 263h53M856 263h53" stroke="#8796b5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="102" y="253" class="h">Saisir la vente</text><text x="102" y="280" class="t">Quantité demandée</text>
  <text x="383" y="253" class="h">Vérifier le stock</text><text x="383" y="280" class="t">Disponible suffisant ?</text>
  <text x="664" y="253" class="h">Déduire la quantité</text><text x="664" y="280" class="t">Stock décrémenté</text>
  <text x="945" y="253" class="h">Garder une trace</text><text x="945" y="280" class="t">Mouvement « vente »</text>
  <rect x="381" y="314" width="168" height="24" rx="12" fill="#532f3b"/><text x="397" y="331" class="tag" fill="#ffb1b1">Sinon : vente refusée</text>
  <!-- Entry lane -->
  <rect x="54" y="375" width="1092" height="155" rx="22" fill="#1c293e" stroke="#35445e"/>
  <rect x="76" y="397" width="183" height="30" rx="15" fill="#163f3c"/><text x="96" y="418" class="tag" fill="#7be2c0">ENTRÉE DE STOCK</text>
  <g fill="#26344b" stroke="#3d4d69"><rect x="82" y="444" width="260" height="61" rx="15"/><rect x="468" y="444" width="260" height="61" rx="15"/><rect x="854" y="444" width="260" height="61" rx="15"/></g>
  <path d="M350 475h103M736 475h103" stroke="#8796b5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="104" y="471" class="h">Saisir la quantité reçue</text><text x="104" y="493" class="t">Nombre entier positif</text>
  <text x="490" y="471" class="h">Augmenter le stock</text><text x="490" y="493" class="t">Quantité ajoutée</text>
  <text x="876" y="471" class="h">Garder une trace</text><text x="876" y="493" class="t">Mouvement « entrée »</text>
  <!-- shared result -->
  <path d="M1020 532v28H180v27M1020 560v27" fill="none" stroke="#8796b5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="261" y="575" width="678" height="53" rx="17" fill="#26344b" stroke="#465879"/>
  <circle cx="294" cy="601" r="11" fill="#f0aa3c"/><text x="320" y="596" class="h">État recalculé selon le seuil d’alerte</text><text x="320" y="617" class="t">Stock faible si quantité ≤ seuil configuré sur le produit</text>
</svg>
